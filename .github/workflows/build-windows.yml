name: Build SORTIQ 2.0 for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sortiq/**'
      - 'tests/**'
      - 'main.py'
      - 'requirements*.txt'
      - 'installer/**'
      - 'assets/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  windows-release:
    name: Test and package Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify complete SORTIQ source has been uploaded
        shell: pwsh
        run: |
          @('main.py','sortiq/gui.py','sortiq/engine.py','sortiq/autopilot.py','installer/SORTIQ_Setup.iss','requirements.txt','requirements-ai.txt') | ForEach-Object {
            if (!(Test-Path $_)) { throw "Missing source file: $_. Upload the complete source project before building." }
          }

      - name: Set up Python on build runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ai.txt pyinstaller pytest pillow

      - name: Generate any missing original SORTIQ toolbar icons
        shell: pwsh
        run: |
          if (!(Test-Path 'assets/icons/sortiq.ico')) {
            if (!(Test-Path 'scripts/make_icons.py')) { throw 'Icon generator and icons are missing.' }
            python scripts/make_icons.py
          }

      - name: Run automated tests
        shell: pwsh
        run: python -m pytest -q tests

      - name: Package Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name SORTIQ --icon 'assets/icons/sortiq.ico' --add-data 'assets;assets' --add-data 'docs;docs' --collect-submodules pypdf --collect-submodules pptx --collect-submodules docx --collect-submodules openpyxl --collect-all fastembed --collect-all onnxruntime --collect-all tokenizers --collect-all huggingface_hub main.py
          if (!(Test-Path 'dist/SORTIQ/SORTIQ.exe')) { throw 'SORTIQ.exe not produced' }

      - name: Packaged executable smoke test
        shell: pwsh
        run: |
          & 'dist/SORTIQ/SORTIQ.exe' --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged executable self-test failed' }

      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SORTIQ-Windows-Portable
          path: dist/SORTIQ/
          retention-days: 14
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer wizard
        shell: pwsh
        run: |
          $paths = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe')
          $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler unavailable' }
          & $iscc 'installer/SORTIQ_Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          if (!(Test-Path 'installer/Output/SORTIQ_2.0_Beta_Setup.exe')) { throw 'Setup EXE not produced' }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SORTIQ-Windows-Installer
          path: installer/Output/SORTIQ_2.0_Beta_Setup.exe
          retention-days: 14
          if-no-files-found: error
