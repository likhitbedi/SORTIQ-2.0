name: Build SORTIQ 2.0 for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  windows-release:
    name: Build portable EXE and installer
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python on Windows build runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install builder and application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ai.txt pyinstaller pytest
      - name: Run checks
        shell: pwsh
        run: python -m pytest -q tests
      - name: Package a standalone Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name SORTIQ --icon "assets/icons/sortiq.ico" --add-data "assets;assets" --add-data "docs;docs" --collect-submodules pypdf --collect-submodules pptx --collect-submodules docx --collect-submodules openpyxl --collect-all fastembed --collect-all onnxruntime --collect-all tokenizers --collect-all huggingface_hub main.py
          if (!(Test-Path 'dist/SORTIQ/SORTIQ.exe')) { throw 'SORTIQ.exe was not produced.' }
      - name: Fetch and include the complete ONNX model and tokenizer in Windows distribution
        shell: pwsh
        run: |
          python scripts/bundle_ai_model.py --output dist/SORTIQ/ai-model
          if (!(Test-Path 'dist/SORTIQ/ai-model/sortiq-model.json')) { throw 'AI model was not bundled' }
      - name: Smoke-test the packaged executable (without downloading a model)
        shell: pwsh
        run: |
          # PowerShell does not reliably wait for a windowed Windows executable
          # when invoked with the call operator. Start-Process -Wait is required
          # before inspecting the exit code.
          $exe = (Resolve-Path 'dist/SORTIQ/SORTIQ.exe').Path
          $result = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          Write-Host "Packaged application exit code: $($result.ExitCode)"
          if ($result.ExitCode -ne 0) { throw "Packaged EXE self-test failed: exit $($result.ExitCode)" }
      - name: Test real local AI model inside packaged windowed EXE
        shell: pwsh
        run: |
          # Verify that the packaged model runs with every network connection blocked.
          $exe = (Resolve-Path 'dist/SORTIQ/SORTIQ.exe').Path
          $result = Start-Process -FilePath $exe -ArgumentList '--ai-self-test' -Wait -PassThru
          Write-Host "Packaged local AI exit code: $($result.ExitCode)"
          if ($result.ExitCode -ne 0) {
            $diagnostic = Join-Path $env:RUNNER_TEMP 'SORTIQ-ai-smoke-error.txt'
            if (Test-Path $diagnostic) { Get-Content $diagnostic }
            throw "Packaged local AI failed: exit $($result.ExitCode)"
          }
      - name: Verify complete on-device model payload
        shell: pwsh
        run: |
          $dir = 'dist/SORTIQ/ai-model'
          $total = (Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "AI model bytes bundled: $total"
          if ($total -lt 40000000) { throw 'Model files are too small for a valid offline bundle' }
      - name: Create a portable ZIP containing SORTIQ.exe
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/SORTIQ/*' -DestinationPath 'SORTIQ_Windows_Portable.zip' -Force
      - name: Upload ready-to-run portable app
        uses: actions/upload-artifact@v4
        with:
          name: SORTIQ-Windows-Portable
          path: SORTIQ_Windows_Portable.zip
          retention-days: 14
          if-no-files-found: error
      - name: Install Inno Setup to make setup wizard
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build setup installer
        shell: pwsh
        run: |
          $paths = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')
          $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) { throw 'Inno Setup compiler ISCC.exe not found' }
          & $iscc 'installer/SORTIQ_Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          if (!(Test-Path 'installer/Output/SORTIQ_2.0.3_Beta_Setup.exe')) { throw 'Setup.exe not produced' }
      - name: Upload Windows setup wizard
        uses: actions/upload-artifact@v4
        with:
          name: SORTIQ-Windows-Installer
          path: installer/Output/SORTIQ_2.0.3_Beta_Setup.exe
          retention-days: 14
          if-no-files-found: error
